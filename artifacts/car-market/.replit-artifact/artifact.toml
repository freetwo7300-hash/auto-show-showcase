kind = "web"
previewPath = "/"
title = "Car Market"
version = "1.0.0"
id = "artifacts/car-market"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20683

[services.development]
run = "pnpm --filter @workspace/car-market run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/car-market", "run", "build" ]
publicDir = "artifacts/car-market/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20683"
BASE_PATH = "/"
